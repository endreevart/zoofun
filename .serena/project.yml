# Serena index for API + island + CRM.
# Commercial site (zooo.fun) is /Volumes/Siska/DEVELOP/zoofun-web.
project_name: "zoofun"

encoding: "utf-8"
line_ending: lf
language_backend:
ignore_all_files_in_gitignore: true
ls_specific_settings: {}

ignored_paths:
  - "client/**"
  - "handoff/**"
  - "chudiki/public/**"
  - "chudiki/dist/**"
  - "crm/dist/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "docs/legal/**"

read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
default_modes:
added_modes:

initial_prompt: |
  Zooofun. The commercial site is the zoofun-web repo (zooo.fun), not this tree.
  This repo is API, Chudiki island, CRM, Unity, infra. Product truth: docs/PRODUCT.md, docs/DECISIONS.md, docs/WORKING_STATE.md.
  Audience 3–8 with parent gate. Recognition before polish. No friends/chat/StoreKit/subscriptions.
  OpenRouter, T-Bank, SMTP, operator secrets stay in untracked .env only.
  Read mem:core first. If code and docs/ disagree, stop and surface the mismatch.

symbol_info_budget:
read_only_memory_patterns: []
ignored_memory_patterns: []
activation_command:
activation_command_timeout: 180.0

# Commercial Next.js site (zooo.fun). Extra LS folder; not in this project's symbol index.
ls_additional_workspace_folders:
  - ../zoofun-web

ls_workspace_folders:
  - backend
  - chudiki/src
  - crm/src

# First LS is the default fallback. Vue covers .vue; typescript covers island + remaining TS.
language_servers:
  - python
  - typescript
  - vue
