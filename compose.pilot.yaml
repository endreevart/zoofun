name: virtual-zoo-pilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_zoo}
      POSTGRES_USER: ${POSTGRES_USER:-virtual_zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_zoo_local_only}
    volumes:
      - zoo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: https://zooo.fun,https://www.zooo.fun,https://crm.zooo.fun
      ACCOUNTS_PATH: /app/.data/accounts.json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-virtual_zoo}:${POSTGRES_PASSWORD:-virtual_zoo_local_only}@postgres:5432/${POSTGRES_DB:-virtual_zoo}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - zoo_accounts:/app/.data
      - local_assets:/data/assets
    restart: unless-stopped

  island:
    build:
      context: ./chudiki
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

volumes:
  zoo_accounts:
  zoo_pg:
  local_assets:
