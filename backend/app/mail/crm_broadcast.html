<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{SUBJECT}}</title>
    <style>
      html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
      table, td { border-collapse: collapse !important; }
      img { border: 0; display: block; outline: none; text-decoration: none; }
      a { text-decoration: none; }
      * { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      @media only screen and (max-width: 620px) {
        .page-pad { padding: 16px 10px !important; }
        .card-pad { padding-left: 22px !important; padding-right: 22px !important; }
        .title { font-size: 30px !important; line-height: 34px !important; }
        .decor { width: 86px !important; }
        .logo { width: 184px !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background:#f2eee3; color:#123a2e;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
      Письмо из сада ZOOOFUN. Имя ребёнка мы не спрашиваем.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:#f2eee3;">
      <tr>
        <td class="page-pad" align="center" style="padding:36px 16px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background:#fffaf0; border:1px solid #dfdacd; border-radius:32px; overflow:hidden; box-shadow:0 18px 45px rgba(18,58,46,.12);">
            <tr>
              <td style="background-color:#c8f2ee; background-image:linear-gradient(145deg,#c8f2ee 0%,#dff4a9 100%); padding:20px 18px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="112" valign="bottom" align="left">
                      <img class="decor" src="{{BUSH_URL}}" width="104" alt="" style="width:104px; max-width:100%; height:auto;">
                    </td>
                    <td align="center" valign="middle" style="padding:8px 4px 26px;">
                      <img class="logo" src="{{LOGO_URL}}" width="212" alt="ZOOOFUN" style="width:212px; max-width:100%; height:auto; margin:0 auto;">
                      <div style="display:inline-block; margin-top:16px; padding:8px 14px; border-radius:999px; background:#fffaf0; color:#315f50; font-family:Arial,sans-serif; font-size:12px; line-height:14px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase;">
                        Письмо из сада
                      </div>
                    </td>
                    <td width="112" valign="bottom" align="right">
                      <img class="decor" src="{{TREE_URL}}" width="104" alt="" style="width:104px; max-width:100%; height:auto; margin-left:auto;">
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td class="card-pad" align="center" style="padding:42px 48px 12px;">
                <h1 class="title" style="margin:0; color:#123a2e; font-family:Arial,sans-serif; font-size:32px; line-height:38px; font-weight:800; letter-spacing:-.6px;">
                  {{SUBJECT}}
                </h1>
              </td>
            </tr>

            <tr>
              <td class="card-pad" style="padding:18px 48px 8px;">
                {{BODY}}
                {{HOP}}
              </td>
            </tr>

            <tr>
              <td class="card-pad" style="padding:8px 48px 36px;">
                <p style="margin:0; color:#8aa396; font-family:Arial,sans-serif; font-size:12px; line-height:18px;">
                  Это письмо для родителя. Имя ребёнка и рисунки мы не кладём в рассылку.
                  Если письма больше не нужны — <a href="{{UNSUB}}" style="color:#315f50; font-weight:700;">отписаться</a>.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="background:#123a2e; padding:23px 28px 25px;">
                <p style="margin:0; color:#eaf6dc; font-family:Arial,sans-serif; font-size:14px; line-height:20px; font-weight:700;">zooo.fun</p>
                <p style="margin:6px 0 0; color:#a9c9ba; font-family:Arial,sans-serif; font-size:12px; line-height:18px;">Собственный волшебный зоопарк вашего ребёнка</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
